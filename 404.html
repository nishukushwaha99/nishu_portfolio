<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Nishu Kushwaha Portfolio</title>
  <meta name="robots" content="noindex, follow">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #060811;
      --bg-surface: rgba(17, 24, 42, 0.75);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent-primary: #00f5d4;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    .glow-orb {
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 245, 212, 0.15) 0%, rgba(56, 189, 248, 0.05) 50%, transparent 70%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 580px;
      width: 100%;
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(4.5rem, 12vw, 7.5rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #00f5d4 0%, #38bdf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      letter-spacing: -2px;
    }

    .error-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #fff;
    }

    .error-desc {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #00f5d4 0%, #38bdf8 100%);
      color: #060811;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 13px 28px;
      border-radius: 9999px;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 245, 212, 0.35);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 245, 212, 0.5);
    }
  </style>
</head>
<body>
  <div class="glow-orb"></div>
  <div class="container">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The portfolio page or resource you are looking for does not exist or has been relocated.</p>
    <a href="./index.html" class="btn">
      <i class="fa-solid fa-arrow-left"></i>
      <span>Back to Portfolio</span>
    </a>
  </div>
</body>
</html>
